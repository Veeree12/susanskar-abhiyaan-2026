<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-page">

  <div class="dashboard">

    <h1>Student Dashboard</h1>

    <p id="student-name" class="student-name"></p>


    <!-- =========================
         AUGUST
    ========================== -->

    <div class="upload-card">

      <h2>August Sheet Upload</h2>

      <input
        type="file"
        id="August"
        accept="image/*"
      >

      <button onclick="uploadImage('August')">
        Upload August Sheet
      </button>

      <p id="August-message"></p>


      <label class="points-label">
        August Points
      </label>

      <input
        type="number"
        id="August-points"
        class="points-input"
        min="0"
        step="1"
        placeholder="Enter August points"
      >

      <button
        class="points-button"
        onclick="savePoints('August')"
      >
        Save August Points
      </button>

      <p id="August-points-message"></p>

    </div>



    <!-- =========================
         SEPTEMBER
    ========================== -->

    <div class="upload-card">

      <h2>September Sheet Upload</h2>

      <input
        type="file"
        id="September"
        accept="image/*"
      >

      <button onclick="uploadImage('September')">
        Upload September Sheet
      </button>

      <p id="September-message"></p>


      <label class="points-label">
        September Points
      </label>

      <input
        type="number"
        id="September-points"
        class="points-input"
        min="0"
        step="1"
        placeholder="Enter September points"
      >

      <button
        class="points-button"
        onclick="savePoints('September')"
      >
        Save September Points
      </button>

      <p id="September-points-message"></p>

    </div>



    <!-- =========================
         OCTOBER
    ========================== -->

    <div class="upload-card">

      <h2>October Sheet Upload</h2>

      <input
        type="file"
        id="October"
        accept="image/*"
      >

      <button onclick="uploadImage('October')">
        Upload October Sheet
      </button>

      <p id="October-message"></p>


      <label class="points-label">
        October Points
      </label>

      <input
        type="number"
        id="October-points"
        class="points-input"
        min="0"
        step="1"
        placeholder="Enter October points"
      >

      <button
        class="points-button"
        onclick="savePoints('October')"
      >
        Save October Points
      </button>

      <p id="October-points-message"></p>

    </div>



    <!-- =========================
         NOVEMBER
    ========================== -->

    <div class="upload-card">

      <h2>November Sheet Upload</h2>

      <input
        type="file"
        id="November"
        accept="image/*"
      >

      <button onclick="uploadImage('November')">
        Upload November Sheet
      </button>

      <p id="November-message"></p>


      <label class="points-label">
        November Points
      </label>

      <input
        type="number"
        id="November-points"
        class="points-input"
        min="0"
        step="1"
        placeholder="Enter November points"
      >

      <button
        class="points-button"
        onclick="savePoints('November')"
      >
        Save November Points
      </button>

      <p id="November-points-message"></p>

    </div>



    <!-- =========================
         FINAL TOTAL POINTS
    ========================== -->

    <div class="upload-card">

      <h2>Total Points Upload</h2>

      <input
        type="file"
        id="Total Points"
        accept="image/*"
      >

      <button onclick="uploadImage('Total Points')">
        Upload Total Points
      </button>

      <p id="Total Points-message"></p>


      <label class="points-label">
        Final Total Points
      </label>

      <input
        type="number"
        id="Final Total Points-points"
        class="points-input"
        min="0"
        step="1"
        placeholder="Enter final total points"
      >

      <button
        class="points-button"
        onclick="savePoints('Final Total Points')"
      >
        Save Final Total Points
      </button>

      <p id="Final Total Points-points-message"></p>

    </div>

  </div>



<script>

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxHJ2TX812WBNjBZ2iH_vHweRTlRdynSl1gpnGwbBwANza1ZasOWszPVYV6IcX8-Ng-4g/exec";


// ===============================
// GET LOGIN DETAILS
// ===============================

const dob =
  localStorage.getItem("studentDOB");

const whatsapp =
  localStorage.getItem("studentWhatsapp");

const studentName =
  localStorage.getItem("studentName");


// ===============================
// DISPLAY STUDENT NAME
// ===============================

if (studentName) {

  document.getElementById(
    "student-name"
  ).textContent =
    "Welcome, " + studentName;

}


// ===============================
// CHECK LOGIN
// ===============================

if (!dob || !whatsapp) {

  alert("Please login first.");

  window.location.href =
    "index.html";

}


// ===============================
// UPLOAD IMAGE
// ===============================

async function uploadImage(month) {

  const fileInput =
    document.getElementById(month);

  const message =
    document.getElementById(
      month + "-message"
    );

  if (!fileInput.files.length) {

    message.textContent =
      "Please select an image first.";

    message.style.color =
      "red";

    return;
  }

  const file =
    fileInput.files[0];

  message.textContent =
    "Preparing image...";

  message.style.color =
    "#555";


  const reader =
    new FileReader();


  reader.onload =
    function () {

      const img =
        new Image();


      img.onload =
        function () {

          /*
           * Google Sheets has a maximum
           * image size of 1 million pixels.
           *
           * Keeping both dimensions at
           * 1000px or less guarantees
           * that limit is not exceeded.
           */

          const MAX_SIZE = 1000;

          let width = img.width;
          let height = img.height;


          if (
            width > MAX_SIZE ||
            height > MAX_SIZE
          ) {

            if (width > height) {

              height =
                Math.round(
                  height *
                  MAX_SIZE /
                  width
                );

              width =
                MAX_SIZE;

            } else {

              width =
                Math.round(
                  width *
                  MAX_SIZE /
                  height
                );

              height =
                MAX_SIZE;
            }
          }


          const canvas =
            document.createElement(
              "canvas"
            );

          canvas.width =
            width;

          canvas.height =
            height;


          const ctx =
            canvas.getContext(
              "2d"
            );


          if (!ctx) {

            message.textContent =
              "Unable to process this image.";

            message.style.color =
              "red";

            return;
          }


          /*
           * White background so PNG images
           * with transparency don't cause
           * problems when converted to JPEG.
           */

          ctx.fillStyle =
            "#ffffff";

          ctx.fillRect(
            0,
            0,
            width,
            height
          );


          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          /*
           * Try JPEG compression.
           * We keep reducing quality until
           * the image is comfortably below
           * Google's 2 MB limit.
           */

          function makeCompressedImage(
            quality
          ) {

            canvas.toBlob(
              function (blob) {

                if (!blob) {

                  message.textContent =
                    "Unable to compress this image.";

                  message.style.color =
                    "red";

                  return;
                }


                /*
                 * Keep a safety margin below
                 * Google's 2 MB limit.
                 */

                if (
                  blob.size > 1.5 * 1024 * 1024 &&
                  quality > 0.45
                ) {

                  makeCompressedImage(
                    quality - 0.10
                  );

                  return;
                }


                /*
                 * Convert compressed image
                 * to Base64.
                 */

                const compressedReader =
                  new FileReader();


                compressedReader.onload =
                  function () {

                    const imageData =
                      compressedReader.result;


                    message.textContent =
                      "Uploading...";

                    message.style.color =
                      "#555";


                    /*
                     * Create a hidden iframe.
                     *
                     * This prevents the phone browser
                     * from leaving your website and
                     * opening the Apps Script page.
                     */

                    const iframe =
                      document.createElement(
                        "iframe"
                      );

                    const frameName =
                      "uploadFrame_" +
                      Date.now();

                    iframe.name =
                      frameName;

                    iframe.style.display =
                      "none";

                    document.body.appendChild(
                      iframe
                    );


                    /*
                     * Create a normal POST form.
                     */

                    const form =
                      document.createElement(
                        "form"
                      );

                    form.method =
                      "POST";

                    form.action =
                      APPS_SCRIPT_URL;

                    form.target =
                      frameName;

                    form.style.display =
                      "none";


                    function addField(
                      name,
                      value
                    ) {

                      const input =
                        document.createElement(
                          "input"
                        );

                      input.type =
                        "hidden";

                      input.name =
                        name;

                      input.value =
                        value;

                      form.appendChild(
                        input
                      );
                    }


                    addField(
                      "action",
                      "upload"
                    );

                    addField(
                      "dob",
                      dob
                    );

                    addField(
                      "whatsapp",
                      whatsapp
                    );

                    addField(
                      "month",
                      month
                    );

                    addField(
                      "imageData",
                      imageData
                    );


                    document.body.appendChild(
                      form
                    );


                    /*
                     * Send to Apps Script
                     * without navigating away.
                     */

                    form.submit();


                    message.textContent =
                      "Upload processing...";

                    message.style.color =
                      "#555";


                    /*
                     * Give Apps Script time to
                     * insert the image.
                     */

                    setTimeout(
                      function () {

                        message.textContent =
                          "✓ Upload Done.";

                        message.style.color =
                          "green";

                        fileInput.value =
                          "";

                        form.remove();
                        iframe.remove();

                      },
                      5000
                    );

                  };


                compressedReader.readAsDataURL(
                  blob
                );

              },
              "image/jpeg",
              quality
            );
          }


          /*
           * Start with good quality.
           * The function automatically
           * reduces it if necessary.
           */

          makeCompressedImage(0.85);

        };


      img.onerror =
        function () {

          message.textContent =
            "This photo format is not supported. Please choose a JPG or PNG photo.";

          message.style.color =
            "red";
        };


      img.src =
        reader.result;
    };


  reader.onerror =
    function () {

      message.textContent =
        "Unable to read this image.";

      message.style.color =
        "red";
    };


  reader.readAsDataURL(file);

}

// ===============================
// SAVE POINTS
// ===============================

async function savePoints(category) {

  const input =
    document.getElementById(
      category + "-points"
    );

  const message =
    document.getElementById(
      category + "-points-message"
    );


  const points =
    input.value.trim();


  if (points === "") {

    message.textContent =
      "Please enter points.";

    message.style.color =
      "red";

    return;

  }


  const numericPoints =
    Number(points);


  if (
    isNaN(numericPoints) ||
    numericPoints < 0
  ) {

    message.textContent =
      "Please enter a valid points value.";

    message.style.color =
      "red";

    return;

  }


  message.textContent =
    "Saving...";

  message.style.color =
    "#555";


  const formData =
    new URLSearchParams();


  formData.append(
    "action",
    "savePoints"
  );

  formData.append(
    "dob",
    dob
  );

  formData.append(
    "whatsapp",
    whatsapp
  );


  // For the final points,
  // send the correct Apps Script category
  const apiCategory =
    category === "Final Total Points"
      ? "Final Total Points"
      : category;


  formData.append(
    "month",
    apiCategory
  );

  formData.append(
    "points",
    numericPoints
  );


  try {

    const response =
      await fetch(
        APPS_SCRIPT_URL,
        {
          method: "POST",
          body: formData
        }
      );


    const result =
      await response.json();


    if (result.success) {

      message.textContent =
        "✓ " +
        result.message;

      message.style.color =
        "green";

    } else {

      message.textContent =
        result.message;

      message.style.color =
        "red";

    }


  } catch (error) {

    message.textContent =
      "Unable to save points. Please try again.";

    message.style.color =
      "red";

  }

}

</script>

</body>
</html>
