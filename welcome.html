<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-page">

  <div class="dashboard">

    <h1>Student Dashboard</h1>

    <p id="student-name" class="student-name"></p>


    <!-- =========================
         AUGUST
    ========================== -->

    <div class="upload-card">

      <h2>August Sheet Upload</h2>

      <input
        type="file"
        id="August"
        accept="image/*"
      >

      <button onclick="uploadImage('August')">
        Upload August Sheet
      </button>

      <p id="August-message"></p>


      <label class="points-label">
        August Points
      </label>

      <input
        type="number"
        id="August-points"
        class="points-input"
        min="0"
        step="1"
        placeholder="Enter August points"
      >

      <button
        class="points-button"
        onclick="savePoints('August')"
      >
        Save August Points
      </button>

      <p id="August-points-message"></p>

    </div>



    <!-- =========================
         SEPTEMBER
    ========================== -->

    <div class="upload-card">

      <h2>September Sheet Upload</h2>

      <input
        type="file"
        id="September"
        accept="image/*"
      >

      <button onclick="uploadImage('September')">
        Upload September Sheet
      </button>

      <p id="September-message"></p>


      <label class="points-label">
        September Points
      </label>

      <input
        type="number"
        id="September-points"
        class="points-input"
        min="0"
        step="1"
        placeholder="Enter September points"
      >

      <button
        class="points-button"
        onclick="savePoints('September')"
      >
        Save September Points
      </button>

      <p id="September-points-message"></p>

    </div>



    <!-- =========================
         OCTOBER
    ========================== -->

    <div class="upload-card">

      <h2>October Sheet Upload</h2>

      <input
        type="file"
        id="October"
        accept="image/*"
      >

      <button onclick="uploadImage('October')">
        Upload October Sheet
      </button>

      <p id="October-message"></p>


      <label class="points-label">
        October Points
      </label>

      <input
        type="number"
        id="October-points"
        class="points-input"
        min="0"
        step="1"
        placeholder="Enter October points"
      >

      <button
        class="points-button"
        onclick="savePoints('October')"
      >
        Save October Points
      </button>

      <p id="October-points-message"></p>

    </div>



    <!-- =========================
         NOVEMBER
    ========================== -->

    <div class="upload-card">

      <h2>November Sheet Upload</h2>

      <input
        type="file"
        id="November"
        accept="image/*"
      >

      <button onclick="uploadImage('November')">
        Upload November Sheet
      </button>

      <p id="November-message"></p>


      <label class="points-label">
        November Points
      </label>

      <input
        type="number"
        id="November-points"
        class="points-input"
        min="0"
        step="1"
        placeholder="Enter November points"
      >

      <button
        class="points-button"
        onclick="savePoints('November')"
      >
        Save November Points
      </button>

      <p id="November-points-message"></p>

    </div>



    <!-- =========================
         FINAL TOTAL POINTS
    ========================== -->

    <div class="upload-card">

      <h2>Total Points Upload</h2>

      <input
        type="file"
        id="Total Points"
        accept="image/*"
      >

      <button onclick="uploadImage('Total Points')">
        Upload Total Points
      </button>

      <p id="Total Points-message"></p>


      <label class="points-label">
        Final Total Points
      </label>

      <input
        type="number"
        id="Final Total Points-points"
        class="points-input"
        min="0"
        step="1"
        placeholder="Enter final total points"
      >

      <button
        class="points-button"
        onclick="savePoints('Final Total Points')"
      >
        Save Final Total Points
      </button>

      <p id="Final Total Points-points-message"></p>

    </div>

  </div>



<script>

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxHJ2TX812WBNjBZ2iH_vHweRTlRdynSl1gpnGwbBwANza1ZasOWszPVYV6IcX8-Ng-4g/exec";


// ===============================
// GET LOGIN DETAILS
// ===============================

const dob =
  localStorage.getItem("studentDOB");

const whatsapp =
  localStorage.getItem("studentWhatsapp");

const studentName =
  localStorage.getItem("studentName");


// ===============================
// DISPLAY STUDENT NAME
// ===============================

if (studentName) {

  document.getElementById(
    "student-name"
  ).textContent =
    "Welcome, " + studentName;

}


// ===============================
// CHECK LOGIN
// ===============================

if (!dob || !whatsapp) {

  alert("Please login first.");

  window.location.href =
    "index.html";

}


// ===============================
// UPLOAD IMAGE
// ===============================

async function uploadImage(month) {

  const fileInput =
    document.getElementById(month);

  const message =
    document.getElementById(
      month + "-message"
    );


  if (!fileInput.files.length) {

    message.textContent =
      "Please select an image first.";

    message.style.color =
      "red";

    return;

  }


  const file =
    fileInput.files[0];


  // Maximum 5 MB
  if (
    file.size >
    5 * 1024 * 1024
  ) {

    message.textContent =
      "Image must be smaller than 5 MB.";

    message.style.color =
      "red";

    return;

  }


  message.textContent =
    "Uploading...";

  message.style.color =
    "#555";


  const reader =
    new FileReader();


  reader.onload =
    async function () {

      const imageData =
        reader.result;


      const formData =
        new URLSearchParams();


      formData.append(
        "action",
        "upload"
      );

      formData.append(
        "dob",
        dob
      );

      formData.append(
        "whatsapp",
        whatsapp
      );

      formData.append(
        "month",
        month
      );

      formData.append(
        "imageData",
        imageData
      );


      try {

        const response =
          await fetch(
            APPS_SCRIPT_URL,
            {
              method: "POST",
              body: formData
            }
          );


        const result =
          await response.json();


        if (result.success) {

          message.textContent =
            "✓ " +
            result.message;

          message.style.color =
            "green";

          fileInput.value =
            "";

        } else {

          message.textContent =
            result.message;

          message.style.color =
            "red";

        }


      } catch (error) {

        console.error("Upload error:", error);
      
        message.textContent =
          "Upload failed: " + error.message;
      
        message.style.color =
          "red";

      }

    };


  reader.readAsDataURL(file);

}



// ===============================
// SAVE POINTS
// ===============================

async function savePoints(category) {

  const input =
    document.getElementById(
      category + "-points"
    );

  const message =
    document.getElementById(
      category + "-points-message"
    );


  const points =
    input.value.trim();


  if (points === "") {

    message.textContent =
      "Please enter points.";

    message.style.color =
      "red";

    return;

  }


  const numericPoints =
    Number(points);


  if (
    isNaN(numericPoints) ||
    numericPoints < 0
  ) {

    message.textContent =
      "Please enter a valid points value.";

    message.style.color =
      "red";

    return;

  }


  message.textContent =
    "Saving...";

  message.style.color =
    "#555";


  const formData =
    new URLSearchParams();


  formData.append(
    "action",
    "savePoints"
  );

  formData.append(
    "dob",
    dob
  );

  formData.append(
    "whatsapp",
    whatsapp
  );


  // For the final points,
  // send the correct Apps Script category
  const apiCategory =
    category === "Final Total Points"
      ? "Final Total Points"
      : category;


  formData.append(
    "month",
    apiCategory
  );

  formData.append(
    "points",
    numericPoints
  );


  try {

    const response =
      await fetch(
        APPS_SCRIPT_URL,
        {
          method: "POST",
          body: formData
        }
      );


    const result =
      await response.json();


    if (result.success) {

      message.textContent =
        "✓ " +
        result.message;

      message.style.color =
        "green";

    } else {

      message.textContent =
        result.message;

      message.style.color =
        "red";

    }


  } catch (error) {

    message.textContent =
      "Unable to save points. Please try again.";

    message.style.color =
      "red";

  }

}

</script>

</body>
</html>
