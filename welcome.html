<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-page">

  <div class="dashboard">

    <h1>Student Dashboard</h1>

    <p id="student-name" class="student-name"></p>


    <!-- =========================
         AUGUST
    ========================== -->

    <div class="upload-card">

      <h2>August Sheet Photo Upload</h2>

      <input
        type="file"
        id="August"
        accept="image/*"
      >

      <p id="August-message"></p>

      <label class="points-label">
        August Points
      </label>
      <input
        type="number"
        id="August-points"
        class="points-input"
        min="0"
        step="1"
        placeholder="Enter August points"
      >

      <button
        class="points-button"
        onclick="savePoints('August')"
      >
        SUBMIT AUGUST UPDATE
      </button>

      <p id="August-points-message"></p>

    </div>



    <!-- =========================
         SEPTEMBER
    ========================== -->

    <div class="upload-card">

      <h2>September Sheet Photo Upload</h2>

      <input
        type="file"
        id="September"
        accept="image/*"
      >

      <p id="September-message"></p>


      <label class="points-label">
        September Points
      </label>

      <input
        type="number"
        id="September-points"
        class="points-input"
        min="0"
        step="1"
        placeholder="Enter September points"
      >

      <button class="points-button"
        onclick="submitMonthlyUpdate('September')">
        SUBMIT SEPTEMBER UPDATE
      </button>

      <p id="September-points-message"></p>

    </div>



    <!-- =========================
         OCTOBER
    ========================== -->

    <div class="upload-card">

      <h2>October Sheet Photo Upload</h2>

      <input
        type="file"
        id="October"
        accept="image/*"
      >

      <button onclick="uploadImage('October')">
        Upload October Sheet
      </button>

      <p id="October-message"></p>


      <label class="points-label">
        October Points
      </label>

      <input
        type="number"
        id="October-points"
        class="points-input"
        min="0"
        step="1"
        placeholder="Enter October points"
      >

      <button class="points-button"
        onclick="submitMonthlyUpdate('October')">
        SUBMIT OCTOBER UPDATE
      </button>

      <p id="October-points-message"></p>

    </div>


    <!-- =========================
         FINAL TOTAL POINTS
    ========================== -->

    <div class="upload-card">

      <h2>Total Points Photo Upload</h2>

      <input
        type="file"
        id="Total Points"
        accept="image/*"
      >

      <button onclick="uploadImage('Total Points')">
        Upload Total Points
      </button>

      <p id="Total Points-message"></p>


      <label class="points-label">
        Final Total Points
      </label>

      <input
        type="number"
        id="Final Total Points-points"
        class="points-input"
        min="0"
        step="1"
        placeholder="Enter final total points"
      >

      <button class="points-button"
        onclick="submitMonthlyUpdate('Total Points')">
        SUBMIT FINAL TOTAL UPDATE
      </button>

      <p id="Final Total Points-points-message"></p>

    </div>

  </div>



<script>

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxHJ2TX812WBNjBZ2iH_vHweRTlRdynSl1gpnGwbBwANza1ZasOWszPVYV6IcX8-Ng-4g/exec";


// ===============================
// GET LOGIN DETAILS
// ===============================

const dob =
  localStorage.getItem("studentDOB");

const whatsapp =
  localStorage.getItem("studentWhatsapp");

const studentName =
  localStorage.getItem("studentName");


// ===============================
// DISPLAY STUDENT NAME
// ===============================

if (studentName) {

  document.getElementById(
    "student-name"
  ).textContent =
    "Welcome, " + studentName;

}


// ===============================
// CHECK LOGIN
// ===============================

if (!dob || !whatsapp) {

  alert("Please login first.");

  window.location.href =
    "index.html";

}



// ===============================
// COMPRESS IMAGE
// ===============================

function compressImage(file) {

  return new Promise(function(resolve, reject) {

    const reader = new FileReader();

    reader.onload = function() {

      const img = new Image();

      img.onload = function() {

        const MAX_SIZE = 1000;

        let width = img.width;
        let height = img.height;

        if (width > MAX_SIZE || height > MAX_SIZE) {

          if (width > height) {
            height = Math.round(height * MAX_SIZE / width);
            width = MAX_SIZE;
          } else {
            width = Math.round(width * MAX_SIZE / height);
            height = MAX_SIZE;
          }

        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");

        if (!ctx) {
          reject(new Error("Unable to process image."));
          return;
        }

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, width, height);

        ctx.drawImage(img, 0, 0, width, height);

        function makeBlob(quality) {

          canvas.toBlob(function(blob) {

            if (!blob) {
              reject(new Error("Image compression failed."));
              return;
            }

            if (blob.size > 1.5 * 1024 * 1024 && quality > 0.45) {
              makeBlob(quality - 0.10);
              return;
            }

            if (blob.size > 1.5 * 1024 * 1024) {
              reject(new Error("Image is too large. Choose another photo."));
              return;
            }

            const compressedReader = new FileReader();

            compressedReader.onload = function() {
              resolve(compressedReader.result);
            };

            compressedReader.onerror = function() {
              reject(new Error("Unable to read compressed image."));
            };

            compressedReader.readAsDataURL(blob);

          }, "image/jpeg", quality);

        }

        makeBlob(0.85);

      };

      img.onerror = function() {
        reject(new Error("Unsupported image. Please choose a JPG or PNG."));
      };

      img.src = reader.result;

    };

    reader.onerror = function() {
      reject(new Error("Unable to read selected image."));
    };

    reader.readAsDataURL(file);

  });

}


// ===============================
// COMBINED IMAGE + POINTS SUBMISSION
// ===============================

async function submitMonthlyUpdate(month) {

  const fileInput = document.getElementById(month);

  const pointsInput = document.getElementById(month + "-points");

  const imageMessage = document.getElementById(month + "-message");

  const pointsMessage = document.getElementById(month + "-points-message");

  const button = document.querySelector(
    `button[onclick="submitMonthlyUpdate('${month}')"]`
  );

  // Validate image
  if (!fileInput || !fileInput.files.length) {
    imageMessage.textContent = "Please select an image first.";
    imageMessage.style.color = "red";
    return;
  }

  // Validate points
  const points = pointsInput.value.trim();

  if (points === "") {
    pointsMessage.textContent = "Please enter points.";
    pointsMessage.style.color = "red";
    return;
  }

  const numericPoints = Number(points);

  if (!Number.isFinite(numericPoints) || numericPoints < 0) {
    pointsMessage.textContent = "Please enter valid points.";
    pointsMessage.style.color = "red";
    return;
  }

  if (!Number.isInteger(numericPoints)) {
    pointsMessage.textContent = "Please enter whole-number points.";
    pointsMessage.style.color = "red";
    return;
  }

  if (!dob || !whatsapp) {
    alert("Please login first.");
    window.location.href = "index.html";
    return;
  }

  if (button) {
    button.disabled = true;
    button.textContent = "PROCESSING...";
  }

  imageMessage.textContent = "Compressing image...";
  imageMessage.style.color = "#555";

  pointsMessage.textContent = "Preparing points...";
  pointsMessage.style.color = "#555";

  try {

    // Compress image
    const imageData = await compressImage(fileInput.files[0]);

    imageMessage.textContent = "Sending image and points...";
    pointsMessage.textContent = "Sending image and points...";

    // Create hidden iframe
    const iframe = document.createElement("iframe");

    const frameName = "monthlyUpdateFrame_" + Date.now();

    iframe.name = frameName;
    iframe.style.display = "none";

    document.body.appendChild(iframe);

    // Create POST form
    const form = document.createElement("form");

    form.method = "POST";
    form.action = APPS_SCRIPT_URL;
    form.target = frameName;
    form.style.display = "none";

    function addField(name, value) {

      const input = document.createElement("input");

      input.type = "hidden";
      input.name = name;
      input.value = value;

      form.appendChild(input);

    }

    addField("action", "monthlyUpdate");
    addField("dob", dob);
    addField("whatsapp", whatsapp);
    addField("month", month);
    addField("points", numericPoints);
    addField("imageData", imageData);

    document.body.appendChild(form);

    // Submit both together in ONE request
    form.submit();

    imageMessage.textContent = "Submission sent. Processing...";
    pointsMessage.textContent = "Submission sent. Processing...";

    // Apps Script response is cross-origin, so the iframe
    // cannot expose its JSON response to this page.
    // Do not claim success without verifying the spreadsheet.

    setTimeout(function() {

      imageMessage.textContent =
        "Request sent. Please check that the image appears in your dashboard.";

      imageMessage.style.color = "#16733a";

      pointsMessage.textContent =
        "Request sent. Please check that the points were saved.";

      pointsMessage.style.color = "#16733a";

      fileInput.value = "";

      form.remove();
      iframe.remove();

      if (button) {
        button.disabled = false;
        button.textContent = "SUBMIT " + month.toUpperCase() + " UPDATE";
      }

    }, 8000);

  } catch (error) {

    console.error("Monthly update error:", error);

    imageMessage.textContent = error.message || "Image processing failed.";
    imageMessage.style.color = "red";

    pointsMessage.textContent = "Update was not submitted.";
    pointsMessage.style.color = "red";

    if (button) {
      button.disabled = false;
      button.textContent = "SUBMIT " + month.toUpperCase() + " UPDATE";
    }

  }

}



</script>

</body>
</html>
