<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sushankar Abhiyaan 2026 - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <main class="page-wrap">
    <section class="hero">
      <div class="hero-overlay">
        <h1>LOGIN</h1>
      </div>
    </section>

    <section class="card login-card">
      <label for="dob">Date Of Birth</label>
        <div class="input-wrap dob-wrap">
          <span class="icon">▣</span>
        
          <input
            id="dob"
            type="text"
            inputmode="numeric"
            maxlength="10"
            placeholder="DD/MM/YYYY"
            aria-label="Date of Birth"
            autocomplete="bday"
          >
        
          <button
            type="button"
            class="calendar-btn"
            onclick="openDOBPicker()"
            aria-label="Choose date"
          >
            📅
          </button>
        
          <input
            id="dobPicker"
            type="date"
            class="hidden-date-picker"
            aria-hidden="true"
            tabindex="-1"
          >
        </div>

      <label for="whatsapp">Whatsapp No.</label>
      <div class="input-wrap">
        <span class="icon">☎</span>
        <input id="whatsapp" type="tel" inputmode="numeric" maxlength="10"
               placeholder="Enter Whatsapp No.">
      </div>

      <button class="primary-btn" onclick="login()">LOGIN</button>

      <p class="register-line">Not yet registered?
        <a href="registration.html">Student Registration</a>
      </p>
      <p id="login-message" class="message"></p>
    </section>

    <section class="info-card">
      <div class="info-title">:: आयोजक ::</div>
      <p>मारवाड़ी स्थापित</p>
      <p>श्री चंद्रप्रभ जैन श्वेतांबर ट्रस्ट, बेलगावी </p>
    </section>
    <section class="info-card">
      <div class="info-title">:: संपर्क ::</div>
      <p>श्री अक्षय (गुरुजी)</p>
      <p>72289 25483</p>
      <p>सुशीलाबेन भंडारी</p>
      <p>88807 12821</p>
    </section>    
  </main>

  <script src="script.js"></script>
</body>
</html>
